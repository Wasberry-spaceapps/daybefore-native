name: daybefore
description: A private journal for getting better.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  intl: ^0.19.0
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  http: ^1.2.1
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  archive: any
  pdf: any
  file_selector: any
  share_plus: any
  lucide_icons_flutter: any
  flutter_svg: ^2.0.10
  go_router: ^14.0.0
  sqflite_sqlcipher: ^3.4.1

dev_dependencies:
  intl: ^0.19.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/illustrations/
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#17120D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  windows: { generate: true, image_path: "assets/icon/icon.png", icon_size: 256 }
  macos: { generate: true, image_path: "assets/icon/icon.png" }
