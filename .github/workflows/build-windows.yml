name: Build Windows App

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish windows/DayBefore/DayBefore.csproj -c Release -r win-x64 --self-contained -o publish/win

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: cfat_0Yp2K3pkUi5gTiMGmY4FtdhdGA0NHglyMGSmfLaj3a289c71
        run: npx wrangler r2 object put daybefore-downloads/DayBefore-Setup.exe --file=publish/win/DayBefore.exe --content-type="application/x-msdownload" --remote
