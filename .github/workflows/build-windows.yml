name: Build Windows App

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/DayBefore/DayBefore.csproj

      - name: Build
        run: dotnet build windows/DayBefore/DayBefore.csproj -c Release

      - name: Publish
        run: dotnet publish windows/DayBefore/DayBefore.csproj -c Release -r win-x64 --self-contained -o publish/win

      - name: Create installer with Inno Setup
        run: |
          choco install innosetup -y
          iscc windows/installer.iss

      - name: Upload to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          pip install boto3
          python -c "
          import boto3
          import os
          s3 = boto3.client('s3',
            endpoint_url=os.environ['R2_ENDPOINT'],
            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'])
          s3.upload_file('Output/DayBefore-Setup.exe', 'daybefore-downloads', 'DayBefore-Setup.exe',
            ExtraArgs={'ContentType': 'application/x-msdownload'})
          print('Uploaded to R2')
          "
