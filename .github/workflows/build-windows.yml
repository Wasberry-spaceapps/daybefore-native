name: Build Windows App

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish windows/DayBefore/DayBefore.csproj -c Release -r win-x64 --self-contained -o publish/win

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: false
          files: publish/win/DayBefore.exe
          token: ${{ secrets.GITHUB_TOKEN }}
