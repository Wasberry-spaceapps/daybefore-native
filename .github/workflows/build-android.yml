name: Build Android App

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: cfat_0Yp2K3pkUi5gTiMGmY4FtdhdGA0NHglyMGSmfLaj3a289c71
        run: npx wrangler r2 object put daybefore-downloads/DayBefore.apk --file=android/app/build/outputs/apk/release/app-release-unsigned.apk --content-type="application/vnd.android.package-archive" --remote
