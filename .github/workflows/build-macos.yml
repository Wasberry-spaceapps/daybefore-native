name: Build macOS App

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd macos
          xcodebuild -project DayBefore.xcodeproj -scheme DayBefore -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

      - name: Create DMG
        run: |
          APP=$(find macos/build -name "DayBefore.app" -maxdepth 5 | head -1)
          hdiutil create -volname "Day Before" -srcfolder "$APP" -ov -format UDZO macos/DayBefore.dmg

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: macos/DayBefore.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
