name: Build macOS App

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd macos
          xcodebuild -project DayBefore.xcodeproj -scheme DayBefore -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

      - name: Create DMG
        run: |
          APP=$(find macos/build -name "DayBefore.app" -maxdepth 5 | head -1)
          hdiutil create -volname "Day Before" -srcfolder "$APP" -ov -format UDZO macos/DayBefore.dmg

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: cfat_0Yp2K3pkUi5gTiMGmY4FtdhdGA0NHglyMGSmfLaj3a289c71
        run: npx wrangler r2 object put daybefore-downloads/DayBefore.dmg --file=macos/DayBefore.dmg --content-type="application/x-apple-diskimage" --remote
