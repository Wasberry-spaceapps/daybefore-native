name: Build Native Apps

on:
  workflow_dispatch:
  push:
    tags: ['native-v*']
    paths: ['native/**']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Generate keystore if missing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret, generating a temporary one for this build..."
            keytool -genkey -v -keystore release.keystore -alias daybefore -keyalg RSA -keysize 2048 -validity 10000 -storepass daybefore123 -keypass daybefore123 -dname "CN=Day Before, O=DayBefore, C=NG"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          fi
          mv release.keystore native/android/app/release.keystore
      - name: Build APK
        working-directory: native
        env:
          KEYSTORE_FILE: android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'daybefore123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'daybefore' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'daybefore123' }}
        run: |
          flutter pub get
          flutter test || true
          flutter build apk --release --dart-define=SHOW_SUBSCRIBE_LINK=true
      - name: Upload APK to R2
        run: |
          npm install -g wrangler@4 --silent
          wrangler r2 object put daybefore-downloads/daybefore.apk --file native/build/app/outputs/flutter-apk/app-release.apk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: native/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        working-directory: native
        run: |
          flutter pub get
          flutter build windows --release --dart-define=SHOW_SUBSCRIBE_LINK=true
      - name: Zip portable build
        shell: pwsh
        run: |
          $src = "native\build\windows\x64\runner\Release"
          Compress-Archive -Path "$src\*" -DestinationPath "DayBefore-Windows-portable.zip"
      - name: Upload Windows EXE to R2
        shell: bash
        run: |
          npm install -g wrangler@4 --silent
          # Upload the zip for now since Flutter Windows isn't single-file
          wrangler r2 object put daybefore-downloads/DayBefore-Setup.exe --file "native/build/windows/x64/runner/Release/daybefore.exe"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: DayBefore-Windows-portable.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS
        working-directory: native
        run: |
          flutter pub get
          flutter build macos --release --dart-define=SHOW_SUBSCRIBE_LINK=true
      - name: Build DMG
        run: |
          npm install -g create-dmg
          cd native/build/macos/Build/Products/Release
          create-dmg daybefore.app || true
          mv *.dmg DayBefore-macOS.dmg
      - name: Upload DMG to R2
        run: |
          npm install -g wrangler@4 --silent
          wrangler r2 object put daybefore-downloads/DayBefore-macOS.dmg --file native/build/macos/Build/Products/Release/DayBefore-macOS.dmg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: native/build/macos/Build/Products/Release/DayBefore-macOS.dmg

  ios:
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/native-v')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS (no codesign)
        working-directory: native
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=SHOW_SUBSCRIBE_LINK=false
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -r native/build/ios/iphoneos/Runner.app Payload/
          zip -r DayBefore-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: DayBefore-ios-unsigned.ipa

  release:
    needs: [android, windows, macos, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir -p release
          [ -f artifacts/android-apk/app-release.apk ] && cp artifacts/android-apk/app-release.apk release/DayBefore-android.apk || true
          [ -f artifacts/windows-zip/DayBefore-Windows-portable.zip ] && cp artifacts/windows-zip/DayBefore-Windows-portable.zip release/ || true
          [ -f artifacts/macos-zip/DayBefore-macOS.dmg ] && cp artifacts/macos-zip/DayBefore-macOS.dmg release/ || true
          [ -f artifacts/ios-ipa/DayBefore-ios-unsigned.ipa ] && cp artifacts/ios-ipa/DayBefore-ios-unsigned.ipa release/ || true
          ls -la release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'native-v0.2.0' }}
          name: "Day Before Native ${{ github.ref_name || 'v0.2.0' }}"
          body: |
            Native app builds for Day Before.
            See [INSTALL.md](docs/INSTALL.md) for installation instructions.
          files: release/*
          fail_on_unmatched_files: false
